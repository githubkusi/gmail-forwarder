services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GAMCFGDIR: /var/lib/gam
      GAMUSERCONFIGDIR: /var/lib/gam-auth
      CLIENTSECRETS: /run/gam-client/client_secrets.json # Env var needed by GAM
    volumes:
      - gam_state:/var/lib/gam
      - gam_auth_state:/var/lib/gam-auth
      - gam_client_secrets:/run/gam-client
      - gam_work:/var/lib/gam-work
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gam_state:
  gam_auth_state:
  gam_client_secrets:
  gam_work: