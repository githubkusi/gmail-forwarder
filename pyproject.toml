[project]
name = "gmail-forwarder-web"
version = "0.1.0"
description = "Self-hosted web UI for managing Google Workspace group forwarders with GAM7"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "gam7==7.21.3",
    "jinja2>=3.1,<4",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_forwarder_web"]